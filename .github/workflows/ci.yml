name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - betta-vone
      - betta-vol1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Check and test Codespaces setup script
        run: |
          node --check scripts/setup-codespaces.mjs
          node --test scripts/setup-codespaces.test.mjs

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Check server JavaScript syntax
        working-directory: server
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
          find . -name '*.mjs' -not -path './node_modules/*' -print0 | xargs -0 -r -n1 node --check

      - name: Test media URL authorization
        working-directory: server
        run: node --test tests/*.test.js

      - name: Audit shared UI primitives and button sizing
        run: node client/scripts/audit-ui.mjs
