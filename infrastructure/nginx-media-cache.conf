# Example location blocks to include under your HTTPS server {}.
# Define the cache zone once in the http {} context:
# proxy_cache_path /var/cache/nginx/bookflow levels=1:2 keys_zone=bookflow_media:64m max_size=5g inactive=7d use_temp_path=off;
# Do not cache signed private media.
location /api/media/public/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_cache bookflow_media;
    proxy_cache_valid 200 24h;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status always;
}
location /api/media/private/ {
    proxy_pass http://127.0.0.1:5000;
    add_header Cache-Control "private, no-store" always;
}
