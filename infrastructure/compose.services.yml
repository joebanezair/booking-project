# Optional self-hosted services for BookFlow betta-vone.
# Set strong passwords via an untracked .env file. Keep ports bound to localhost / VPN.
services:
  media-mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MEDIA_MONGO_USER:?Set MEDIA_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MEDIA_MONGO_PASSWORD:?Set MEDIA_MONGO_PASSWORD}
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - media_mongodb:/data/db
  rabbitmq:
    image: rabbitmq:4-management
    hostname: bookflow-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  media_mongodb:
  rabbitmq_data:
  redis_data:
